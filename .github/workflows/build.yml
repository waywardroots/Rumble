name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v6

      # JUCE is a large clone; cache it so only the first run pays for it.
      - name: Cache JUCE
        uses: actions/cache@v5
        with:
          path: build/_deps
          key: ${{ matrix.os }}-juce-9.0.4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DRUMBLE_COPY_PLUGIN=OFF

      # On failure the first errors are also posted as an annotation, so they
      # show on the run's summary page without opening the full log.
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          if ! cmake --build build --config Release --parallel 4 2>&1 | tee build.log; then
            msg=$(grep -E "error|Error" build.log | grep -v "warning" | head -25 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build failed::$msg"
            exit 1
          fi

      # DSP regression tests: decay calibration, swing timing, ducking,
      # mono-below, smoothing, bad-input handling. See tools/engine_tests.cpp.
      - name: Engine tests
        run: ctest --test-dir build -C Release --output-on-failure

      # The .vst3/.component bundles are directories containing symlinks on
      # macOS. upload-artifact does not preserve those, so zip them first.
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          src="build/Rumble_artefacts/Release"
          out="dist"
          mkdir -p "$out"

          # Zip $1 into $out/$2, skipping quietly if that format was not built.
          pack() {
            if [[ ! -e "$1" ]]; then
              echo "skip (not built): $1"
              return 0
            fi
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              ditto -c -k --keepParent "$1" "$out/$2"
              # The embedded Inter font's licence must ship with every copy
              # (SIL OFL 1.1). Added beside the bundle, not inside it, so the
              # bundle's code signature is untouched.
              zip -qj "$out/$2" assets/fonts/Inter-OFL.txt
            else
              7z a -tzip "$out/$2" "$1" > /dev/null
              7z a -tzip "$out/$2" assets/fonts/Inter-OFL.txt > /dev/null
            fi
            echo "packed: $1 -> $out/$2"
          }

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            # Ad-hoc signature: without any signature at all, recent macOS
            # refuses to load the plugin instead of merely warning.
            for b in "$src/VST3/Rumble.vst3" "$src/AU/Rumble.component"; do
              if [[ -e "$b" ]]; then codesign --force --sign - "$b"; fi
            done
            pack "$src/VST3/Rumble.vst3"      Rumble-VST3-macOS.zip
            pack "$src/AU/Rumble.component"   Rumble-AU-macOS.zip
            pack "$src/Standalone/Rumble.app" Rumble-Standalone-macOS.zip
          else
            pack "$src/VST3/Rumble.vst3"      Rumble-VST3-Windows.zip
            pack "$src/Standalone/Rumble.exe" Rumble-Standalone-Windows.zip
          fi

          ls -l "$out"

      # pluginval loads the plugin the way a host does and hammers it:
      # state save/restore, automation, odd buffer sizes and sample rates,
      # parameter fuzzing, opening and closing the editor. Runs after Package
      # so the macOS bundles are already signed.
      - name: pluginval
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
            unzip -q pluginval.zip
            pv="pluginval.app/Contents/MacOS/pluginval"

            # macOS only finds an Audio Unit once it is installed in a
            # Components folder and the AU registry has picked it up, so it
            # cannot be validated straight from the build folder. Install
            # it, restart the registrar, and let Apple's own validator
            # (auval) look it up -- which both registers it and checks it.
            # Codes are AU_MAIN_TYPE / PLUGIN_CODE / PLUGIN_MANUFACTURER_CODE
            # from CMakeLists.txt.
            au_dir="$HOME/Library/Audio/Plug-Ins/Components"
            mkdir -p "$au_dir"
            cp -R build/Rumble_artefacts/Release/AU/Rumble.component "$au_dir/"
            killall -9 AudioComponentRegistrar 2>/dev/null || true
            echo "::group::auval"
            auval -v aufx Rmbl Wywd
            echo "::endgroup::"

            targets=("build/Rumble_artefacts/Release/VST3/Rumble.vst3"
                     "$au_dir/Rumble.component")
          else
            curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
            7z x -y pluginval.zip > /dev/null
            pv="./pluginval.exe"
            targets=("build/Rumble_artefacts/Release/VST3/Rumble.vst3")
          fi
          for t in "${targets[@]}"; do
            echo "::group::pluginval $t"
            "$pv" --strictness-level 10 --validate-in-process --validate "$t"
            echo "::endgroup::"
          done

      # The installers: a setup .exe on Windows (Inno Setup) and a .pkg on
      # macOS, both showing the EULA. Built from the bundles validated above.
      # Unsigned unless signing identities are configured (see
      # installer/README.md), so Windows SmartScreen and macOS Gatekeeper will
      # warn on first run.
      - name: Installer
        shell: bash
        run: |
          set -euo pipefail
          # Post the end of the output as an annotation if anything fails.
          exec > >(tee installer.log) 2>&1
          trap 'rc=$?; if [[ $rc != 0 ]]; then sleep 1; msg=$(tail -25 installer.log | sed "s/%/%25/g" | awk "{printf \"%s%%0A\", \$0}"); echo "::error title=Installer failed::$msg"; fi' EXIT
          version=$(sed -nE 's/^project\(Rumble VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          src="build/Rumble_artefacts/Release"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            art="installer/macos/artifacts"
            rm -rf "$art" && mkdir -p "$art"
            cp -R "$src/AU/Rumble.component" "$src/VST3/Rumble.vst3" "$src/Standalone/Rumble.app" "$art/"
            installer/macos/build_pkg.sh "$version"
            cp "installer/macos/output/Rumble-$version-macOS.pkg" dist/
          else
            art="installer/windows/artifacts"
            rm -rf "$art" && mkdir -p "$art"
            cp -R "$src/VST3/Rumble.vst3" "$src/Standalone/Rumble.exe" "$art/"
            iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
            if [[ ! -x "$iscc" ]]; then
              choco install innosetup -y --no-progress > /dev/null
            fi
            "$iscc" //Q "//DAppVersion=$version" installer/windows/Rumble.iss
            cp "installer/windows/output/Rumble-$version-Windows-x64.exe" dist/
          fi
          ls -l dist

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: Rumble-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # Pushing a version tag (e.g. `git tag v0.26.0 && git push --tags`) publishes
  # a GitHub Release with the installers and every platform's zips attached. Unlike workflow
  # artifacts, releases never expire and anyone can download them without a
  # GitHub account.
  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      # Catch a tag that disagrees with the version compiled into the plugin.
      - name: Check tag matches CMake version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^project\(Rumble VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match CMakeLists.txt version $version"
            exit 1
          fi

      # src/LicenseKey.h ships with a throwaway test key that no real customer
      # key can match. Refuse to publish until it has been swapped for the
      # real one (see docs/LICENSING.md).
      - name: Check the real licence key is in
        shell: bash
        run: |
          if grep -qE 'kIsTestLicenseKey = true' src/LicenseKey.h; then
            echo "::error::src/LicenseKey.h still has the test licence key. Put in your real public key and set kIsTestLicenseKey = false (docs/LICENSING.md)."
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.exe
            dist/*.pkg
            dist/*.zip
          generate_release_notes: true
